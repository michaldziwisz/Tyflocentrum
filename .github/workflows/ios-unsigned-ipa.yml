name: iOS (unsigned IPA)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build (GitHub-hosted)
    # macos-26 = Xcode 26 + SDK iOS 26. Dwa powody, oba twarde:
    # 1) Apple wymaga od 28.04.2026, by aplikacje wysyłane do App Store Connect
    #    były budowane Xcode 26 na SDK iOS 26 (developer.apple.com/news/upcoming-requirements).
    #    Build na starszym SDK nie nadaje się do wydania.
    # 2) Kod używa symboli z nowszego SDK (AVAudioSession .allowBluetoothHFP,
    #    AVAssetExportSession export(to:as:)), więc na Xcode 15.4 nie kompilował
    #    się w ogóle. Obraz macos-14 jest dodatkowo oznaczony jako deprecated.
    # Wersję przypinamy JAWNIE, nie przez -latest: -latest wędruje i zmieniłby
    # SDK w trakcie życia projektu, a to ta sama klasa błędu, co nieprzypięty
    # SwiftFormat (patrz scripts/build-unsigned-ipa.sh).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Lint, test and build unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Tyflocentrum-unsigned-ipa
          path: tyflocentrum.ipa
