name: Diagnostyka testu (powtarzalnosc)

# Tylko gałąź diagnostyczna. Jeden scenariusz, jedna próba, bez wydania.
on:
  workflow_dispatch:
    inputs:
      testy:
        description: 'Dokładny test diagnostyczny'
        required: true
        default: 'TyflocentrumUITests/TyflocentrumSmokeTests/testPullToRefreshUpdatesLists'
      powtorzenia:
        description: 'Wyłącznie 1, zgodnie z limitem diagnozy'
        required: true
        default: '1'
permissions:
  contents: read
jobs:
  kategorie:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Jedna diagnoza kategorii
        env:
          DIAG_TEST: ${{ inputs.testy }}
          DIAG_REPETITIONS: ${{ inputs.powtorzenia }}
        run: bash scripts/diagnose-category-load.sh --zapisz
      - name: Dowody niezależnie od wyniku testu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnoza-kategorii
          path: category-diagnostic
          if-no-files-found: error
      - name: Surowy wynik Xcode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnoza-kategorii-xcresult
          path: CategoryDiagnostic.xcresult
          if-no-files-found: ignore
